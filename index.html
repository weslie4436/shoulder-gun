<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>RE4F</title>
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RE4F" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./app.css?v=36" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <div id="letterbox">
      <i></i>
      <i></i>
    </div>

    <div id="sight" hidden>
      <span class="bracket l"></span>
      <span class="bracket r"></span>
      <b></b>
    </div>

    <aside id="hud">
      <p class="eyebrow">RE4F · 粉絲試作</p>
      <h1 id="stance">待機</h1>
      <dl>
        <div>
          <dt>彈藥</dt>
          <dd id="ammo">15 / 15</dd>
        </div>
        <div>
          <dt>命中</dt>
          <dd id="hits">0</dd>
        </div>
      </dl>
    </aside>

    <ul id="keys">
      <li><kbd>W A S D</kbd> 走</li>
      <li><kbd>Shift</kbd> 跑</li>
      <li><kbd>C</kbd> 蹲，蹲著也能走、瞄準、開槍</li>
      <li><kbd>滑鼠右鍵</kbd> 按住瞄準</li>
      <li><kbd>滑鼠左鍵</kbd> 射擊或揮刀</li>
      <li><kbd>V</kbd> 小刀</li>
      <li><kbd>E</kbd> 爬梯、踢梯、翻越</li>
      <li><kbd>R</kbd> 裝彈</li>
    </ul>

    <div id="gate">
      <p>點一下進入靶場</p>
      <small>電腦按住右鍵瞄準。手機點一下瞄準，再拖畫面移動準心。</small>
    </div>

    <div id="touch" hidden>
      <div id="stick"><i></i></div>
      <div id="pad">
        <button type="button" id="btn-aim">瞄準</button>
        <button type="button" id="btn-fire">射擊</button>
        <button type="button" id="btn-crouch">蹲</button>
        <button type="button" id="btn-knife">刀</button>
        <button type="button" id="btn-sprint">跑</button>
        <button type="button" id="btn-reload">裝彈</button>
      </div>
      <button type="button" id="btn-use" hidden>互動</button>
    </div>
    <p id="prompt" hidden></p>

    <script type="module" src="./main.js?v=36"></script>
  </body>
</html>
